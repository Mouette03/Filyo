name: Purge versions GHCR non taguées

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Déterminer le nom du package container
        run: |
          BASE_NAME=$(basename "${{ github.repository }}")
          echo "GHCR_PACKAGE=$(echo "$BASE_NAME" | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV"

      - name: Purger les versions non taguées (supprimées/restantes)
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.GHCR_PACKAGE }}
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0
          token: ${{ secrets.GITHUB_TOKEN }}