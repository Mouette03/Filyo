name: Purge versions GHCR non taguées

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Lecture seule (dry-run) ou suppression réelle"
        required: true
        type: choice
        options:
          - dry-run
          - supprimer
        default: dry-run

permissions:
  contents: read
  packages: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Déterminer le nom du package container
        run: |
          BASE_NAME=$(basename "${{ github.repository }}")
          echo "GHCR_PACKAGE=$(echo "$BASE_NAME" | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV"

      - name: Lister les versions (dry-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          echo "=== Versions taguées (conservées) ==="
          TAGGED=$(gh api "/repos/$REPO/packages/container/$GHCR_PACKAGE/versions" --paginate \
            --jq '[.[] | select(.metadata.container.tags != null and (.metadata.container.tags | length) > 0)] | length')
          echo "Nombre de versions taguées : $TAGGED"

          echo ""
          echo "=== Versions non taguées (supprimées) ==="
          UNTAGGED=$(gh api "/repos/$REPO/packages/container/$GHCR_PACKAGE/versions" --paginate \
            --jq '[.[] | select(.metadata.container.tags == null or (.metadata.container.tags | length) == 0)] | length')
          echo "Nombre de versions non taguées à purger : $UNTAGGED"

          echo ""
          echo "=== Total versions ==="
          TOTAL=$(gh api "/repos/$REPO/packages/container/$GHCR_PACKAGE/versions" --paginate \
            --jq 'length')
          echo "Total : $TOTAL"

      - name: Purger les versions non taguées
        if: github.event.inputs.action == 'supprimer'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.GHCR_PACKAGE }}
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0
          token: ${{ secrets.GITHUB_TOKEN }}
